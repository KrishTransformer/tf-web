worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include /etc/nginx/resolver.conf;

    server {
        listen 8080;
        server_name  localhost; 

        root   /data/www;
        index  index.html;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        location / {
            try_files $uri $uri/ /index.html =404;
        }

        location /storage-proxy/ {
            # Resolve only when a model is requested, so DNS cannot block startup.
            set $storage_host design.trafointel.com;
            rewrite ^/storage-proxy/(.*)$ /$1 break;
            proxy_pass https://$storage_host;
            proxy_set_header Host $storage_host;
            proxy_ssl_server_name on;
            proxy_ssl_name $storage_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
